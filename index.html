<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>여행 수첩</title>
<meta name="description" content="일정·장소 메모·예약·쇼핑리스트·체크리스트를 한 곳에">
<meta name="theme-color" content="#b8401f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여행 수첩">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 혼자 쓰는 여행 수첩. 손으로 만든 다이어리처럼 따뜻하게, 쓰기는 빠르게.
   IDEA: 점선 종이 위의 여행 노트 — 날짜 도장(원형 탭), 하루 한 장 티켓, 노란 메모지 체크리스트.
   PICTURE: 선택한 날의 세이지색 티켓 카드 + 시간순 세로 타임라인.
   COLOUR and TYPE: 종이 #f4efe6, 먹 #2a211b, 주홍 #b8401f, 세이지 #a9b89f, 머스터드 #eedb9b / Black Han Sans 제목, IBM Plex Sans KR 본문.
   LAYOUT: 모바일 한 열, 최대 720px, 아래 고정 탭 4개. */
:root{color-scheme:light dark;--bg:light-dark(#f4efe6,#191512);--paper:light-dark(#faf6ef,#231e1a);--ink:light-dark(#2a211b,#f1e9dc);--mute:light-dark(#7a6e64,#a99d90);--line:light-dark(#e2d9cb,#3a322b);--acc:light-dark(#b8401f,#e8744f);--sage:light-dark(#a9b89f,#3f4d3a);--mus:light-dark(#eedb9b,#5a4c22);--note:light-dark(#f7eab0,#3a3422);--noteline:light-dark(#e6d690,#4c4430);--ok:light-dark(#3f7a4a,#86c98f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg) radial-gradient(light-dark(#e4dccd,#2a241f) 1px,transparent 1.2px) 0 0/14px 14px;color:var(--ink);font:16px/1.55 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 130px max(16px,env(safe-area-inset-left))}
.disp{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;letter-spacing:-.01em}
h1{font-size:34px;line-height:1.1;margin:6px 0}
h2{font-size:24px;line-height:1.15;margin:26px 0 6px}
.mute{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);font-weight:700}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--acc)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-width:1.5px}
.btn.danger{color:var(--acc)}
a.btn{display:inline-grid;place-content:center;text-decoration:none;color:var(--ink)}
.status{font-size:13px;color:var(--mute);min-height:20px}
.pill{display:inline-block;background:var(--mus);border-radius:999px;padding:4px 14px;font-weight:700;font-size:16px;white-space:nowrap}
/* day stamps */
.days{display:flex;gap:0;overflow-x:auto;padding:12px 2px 14px;scroll-snap-type:x proximity;border-bottom:1.5px solid var(--line);margin-bottom:6px}
.days .gap{flex:1 0 18px;align-self:center;border-top:3px dotted var(--line);margin:0 4px;min-width:18px}
.stamp{flex:none;width:62px;height:62px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);box-shadow:0 5px 0 light-dark(#d9cfbf,#0e0b09);font-size:20px;display:grid;place-content:center;scroll-snap-align:center;line-height:1}
.stamp small{font-family:"IBM Plex Sans KR";font-size:11px;color:var(--mute);margin-top:3px}
.stamp[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.stamp[aria-pressed=true] small{color:#fde3d6}
.stamp.today{border-style:dashed}
/* day ticket */
.ticket{background:var(--paper);border-radius:22px;overflow:clip;margin:12px 0;border:1px solid var(--line)}
.ticket .top{background:var(--sage);padding:20px 20px 22px;position:relative}
.ticket .top .k{font-weight:700;letter-spacing:.04em;font-size:15px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ticket .top h2{font-size:clamp(28px,8vw,40px);margin:8px 0 6px}
.route{font-size:15px;opacity:.85;overflow-wrap:anywhere}
.perf{height:0;border-top:3px dashed var(--line);margin:0 18px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--bg)}
.perf::before{left:-31px}.perf::after{right:-31px}
.tl{position:relative;padding:8px 16px 16px}
.tl::before{content:"";position:absolute;left:104px;top:20px;bottom:24px;border-left:1.5px solid var(--line)}
.ev{display:grid;grid-template-columns:76px 24px minmax(0,1fr);gap:0 6px;padding:14px 0;border-bottom:1.5px solid var(--line)}
.ev:last-child{border-bottom:0}
.tm{text-align:right}
.tm b{display:block;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.kl{display:inline-block;margin-top:6px;border:1.5px solid var(--ink);border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700;letter-spacing:.08em}
.dot{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);margin:5px auto 0;position:relative;z-index:1}
.dot.done{background:var(--ink)}
.chip2{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:0 10px;font-size:13px;color:var(--mute);margin-bottom:4px}
.ttl{border:0;background:none;padding:0;text-align:left;font-size:19px;font-weight:700;line-height:1.35;text-decoration:underline;text-decoration-color:light-dark(#d9b8a8,#6a4a3c);text-decoration-thickness:3px;text-underline-offset:4px;overflow-wrap:anywhere}
.badge{display:inline-block;font-size:13px;font-weight:700;border-radius:6px;padding:1px 8px;margin:4px 6px 0 0;white-space:nowrap}
.badge.need{background:light-dark(#f8dccf,#55291c);color:var(--acc)}
.badge.ok{background:light-dark(#dce8d8,#24361f);color:var(--ok)}
.sub{font-size:14px;color:var(--mute);margin-top:2px}
details{margin-top:6px}
summary{cursor:pointer;color:var(--mute);font-size:14px;list-style:none;min-height:32px;display:flex;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"⌄";margin-left:6px;font-size:16px;line-height:1}
details[open] summary::after{content:"⌃"}
.memo{white-space:pre-wrap;font-size:15px;overflow-wrap:anywhere;background:var(--bg);border-radius:10px;padding:8px 12px;margin:4px 0}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.links a,.links button{min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-size:14px;display:inline-grid;place-content:center;text-decoration:none;color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 18px}
/* overview */
.dcard{width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:10px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
.dcard .disp{font-size:20px}
.sum{background:var(--paper);border-radius:22px;border:1px solid var(--line);padding:18px 20px;margin:12px 0}
.sum .big{font-size:clamp(26px,7vw,36px);line-height:1.15}
.sum .line{border-top:2px dashed var(--line);margin:14px 0 10px}
.todo-cta{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:light-dark(#f8dccf,#3d2018);border:0;border-radius:14px;padding:12px 14px;margin-top:10px;color:var(--ink)}
.todo-cta b{color:var(--acc)}
/* trip list */
.tcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;width:100%;text-align:left;padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--paper);margin:12px 0;box-shadow:0 4px 0 light-dark(#e3dacb,#0e0b09)}
.tcard .n{font-size:24px;line-height:1.15}
.tcard .pill{align-self:center;grid-row:span 2}
/* places & resv */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:14px 16px;margin:10px 0}
.card .meta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:14px;color:var(--mute);margin-top:4px}
.tk{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px}
.tk .kind{border-right:2px dashed var(--line);padding-right:10px;display:grid;align-content:start;gap:2px;font-size:18px}
.tk .kind small{font-family:"IBM Plex Sans KR";font-size:12px;color:var(--mute);white-space:nowrap}
.code{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.code span{font-family:ui-monospace,Menlo,monospace;font-size:17px;font-weight:700;letter-spacing:.04em;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px;overflow-wrap:anywhere}
.warn{color:var(--acc);font-size:13px;font-weight:700}
/* note paper */
.note{background:var(--note);border-radius:4px;padding:16px 18px 10px;margin:14px 0;box-shadow:0 3px 0 light-dark(#e0d29a,#14110a)}
.note h3{margin:0 0 4px;font-size:22px;display:flex;justify-content:space-between;align-items:baseline}
.note h3 small{font-family:"IBM Plex Sans KR";font-size:15px;color:var(--mute);font-weight:400}
.ci{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:start;padding:12px 0;border-bottom:2px solid var(--noteline)}
.ci:last-of-type{border-bottom:0}
.ci input{width:26px;height:26px;margin:2px 0 0;accent-color:var(--acc)}
.ci .tx{font-size:17px;overflow-wrap:anywhere}
.ci.done .tx{text-decoration:line-through;color:var(--mute)}
.ci .x{border:0;background:none;color:var(--mute);width:36px;height:36px;font-size:20px}
.ci .open{border:0;background:none;padding:0;text-align:left;width:100%}
.addrow{display:flex;gap:8px;margin:10px 0 4px}
.addrow input{flex:1;background:light-dark(#fffbe6,#2a2619)}
input[type=text],input[type=date],input[type=time],input[type=url],select,textarea{width:100%;min-height:44px;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--paper)}
textarea{min-height:96px;resize:vertical}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.empty{text-align:center;padding:30px 12px;color:var(--mute)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{min-height:64px;border:0;background:none;font-size:14px;color:var(--mute);display:grid;place-items:center;align-content:center;gap:2px}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected=true]{color:var(--acc);font-weight:700}
.tabs .n{font-size:11px;background:var(--acc);color:#fff;border-radius:999px;padding:0 6px;margin-left:2px}
/* shopping */
.shop{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:18px;background:var(--paper);border:1px solid var(--line);margin:10px 0}
.shop.done{opacity:.55}.shop.done .ttl{text-decoration:line-through;color:var(--mute)}
.thumb{width:72px;height:72px;border-radius:14px;overflow:hidden;border:0;padding:0;background:var(--sage);display:grid;place-content:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:30px;height:30px;fill:none;stroke:var(--ink);stroke-width:1.6;opacity:.6}
.store{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--acc);background:light-dark(#f8dccf,#3d2018);border-radius:6px;padding:1px 8px;margin-bottom:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shop .open{border:0;background:none;padding:0;text-align:left;width:100%}
.shop .ttl{font-size:17px;text-decoration:none}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;color:var(--mute);white-space:pre-wrap}
.sact{display:flex;gap:2px}
.sact button{width:40px;height:40px;border:0;background:none;border-radius:10px;display:grid;place-content:center}
.sact svg{width:22px;height:22px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sact .ck svg{stroke:var(--ok)}.sact .ck.on svg{fill:var(--ok);stroke:var(--ok)}.sact .ck.on svg path{stroke:var(--paper)}
.sact .del svg{stroke:var(--mute)}
.chip .n{opacity:.6;margin-left:4px;font-size:12px}
.photo{width:100%;height:150px;border:2px dashed var(--line);border-radius:16px;background:var(--bg);display:grid;place-content:center;text-align:center;color:var(--mute);font-size:14px;position:relative;overflow:hidden;cursor:pointer}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .rm{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px}
.schips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.install{display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;margin:10px 0}
.install p{margin:0;flex:1;font-size:14px}
.install .btn{border-color:var(--bg);background:var(--bg);color:var(--ink)}
/* sheet */
.veil{position:fixed;inset:0;background:rgba(20,14,10,.5);z-index:20;display:none;align-items:flex-end;justify-content:center}
.veil.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px 28px}
.sheet h3{margin:0 0 12px;font-size:22px}
.f{margin:10px 0}.f label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.f.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:400px){.ev{grid-template-columns:62px 22px minmax(0,1fr)}.tl::before{left:88px}.tm b{font-size:19px}.stamp{width:56px;height:56px;font-size:18px}}
</style></head><body>
<div class="wrap" id="app"><p class="mute">불러오는 중…</p></div>
<nav class="tabs" id="tabs" hidden></nav>
<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="firebase-config.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const TAGS=['맛집','카페','관광','쇼핑','숙소','기타'];
const KINDS=['항공','숙소','투어','교통','식당','티켓','기타'];
const KL={항공:'FLY',교통:'MOVE',숙소:'STAY',맛집:'EAT',식당:'EAT',카페:'CAFE',관광:'SEE',투어:'SEE',쇼핑:'SHOP',티켓:'TICKET',기타:'ETC'};
const WD=['일','월','화','수','목','금','토'],WDJ=['日','月','火','水','木','金','土'];
let trips={},ui={view:'home',id:null,tab:'plan',day:'all',tag:'전체'},mode='loading',col=null,statusMsg='';
const dirty=new Set(),gone=new Set(),timers={},writing={},ver={};

/* ---------- dates ---------- */
const pd=s=>{if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const md=s=>{const d=pd(s);return d?(d.getMonth()+1)+'/'+d.getDate()+' ('+WD[d.getDay()]+')':''};
const mdj=s=>{const d=pd(s);return d?(d.getMonth()+1)+'.'+d.getDate()+' '+WDJ[d.getDay()]:''};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
function days(t){const out=[];if(!t.start)return out;const e=t.end||t.start;let d=pd(t.start);for(let i=0;i<40&&iso(d)<=e;i++){out.push(iso(d));d.setDate(d.getDate()+1)}return out}
function dday(t){const td=today();if(!t.start)return'날짜 미정';if(td<t.start)return'D-'+diff(td,t.start);if(td<=(t.end||t.start))return(diff(t.start,td)+1)+'일차';return'다녀옴'}

/* ---------- storage (이 기기: IndexedDB) ---------- */
const LKEY='tripnote.v1';
const idb={db:null,
  open(){return new Promise((res,rej)=>{if(!('indexedDB' in window))return rej(new Error('no idb'));const r=indexedDB.open('tripnote',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  get(k){return new Promise((res,rej)=>{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  set(k,v){return new Promise((res,rej)=>{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}};
function loadLocal(){try{trips=JSON.parse(localStorage.getItem(LKEY)||'{}')||{}}catch(e){trips={}}}
async function init(){
  try{await idb.open();mode='idb';trips=(await idb.get('trips'))||{};if(!Object.keys(trips).length)loadLocal()}
  catch(e){mode='local';loadLocal()}
  migrateLegacy();render();startSync();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}
let saveT;
function save(id){clearTimeout(saveT);saveT=setTimeout(persist,250);if(id)pushDiff(id)}
async function persist(){clearTimeout(saveT);
  try{if(mode==='idb')await idb.set('trips',JSON.parse(JSON.stringify(trips)));else localStorage.setItem(LKEY,JSON.stringify(trips));setStatus('')}
  catch(e){setStatus('저장 공간이 부족해요');toast('저장하지 못했어요. 사진을 몇 개 지워주세요')}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&saveT)persist()});
/* 예전 ‘Fukuoka Shopping’ 앱 데이터가 같은 주소에 있으면 자동으로 옮겨요 */
function migrateLegacy(){try{
  if(localStorage.getItem('tripnote.migrated'))return;
  const arr=JSON.parse(localStorage.getItem('fukuoka_items')||'[]');

  else if(a==='install'&&deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;render()})}
  else if(a==='importFile'){let fi=$('#fileIn');if(!fi){document.body.insertAdjacentHTML('beforeend','<input type="file" id="fileIn" accept="application/json,.json" hidden>');fi=$('#fileIn')}fi.click()}
  else if(a==='saveFile'){const blob=new Blob([JSON.stringify(t)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=(t.title||'trip').replace(/[\\/:*?"<>|]/g,'_')+'-백업.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
  else if(a==='share'){closeSheet();needName(()=>shareTrip(t))}
  else if(a==='invite')inviteSheet(t);
  else if(a==='nshare'){const L=inviteLink(t);try{await navigator.share({title:'여행 수첩 초대',text:inviteText(t),url:L})}catch(err){if(err&&err.name!=='AbortError'){try{await navigator.clipboard.writeText(inviteText(t)+'\n'+L);toast('초대 메시지를 복사했어요')}catch(e2){toast('링크를 길게 눌러 복사하세요')}}}}
  else if((a==='rotate'||a==='kick'||a==='leave')&&!fb)toast('공유 서버에 연결하지 못했어요. 인터넷을 확인해주세요');
  else if(a==='rotate'){confirmSheet('초대 링크를 새로 만들까요? 예전 링크로는 더 이상 참여할 수 없어요.','새로 만들기',()=>{const c=rand(24);fb.F.updateDoc(fb.F.doc(fb.db,'trips',t.id),{inviteCode:c}).then(()=>toast('새 링크를 만들었어요')).catch(err=>toast('바꾸지 못했어요 ('+(err.code||'')+')'));t.shared.code=c})}
  else if(a==='kick'){const u=b.dataset.u,nm=((t.shared.members||{})[u]||{}).name||'이 사람';confirmSheet(`${nm}님을 내보낼까요?`,'내보내기',()=>{fb.F.updateDoc(fb.F.doc(fb.db,'trips',t.id),{['members.'+u]:fb.F.deleteField()}).catch(err=>toast('내보내지 못했어요'))})}
  else if(a==='leave'){confirmSheet(`‘${t.title}’ 공유에서 나갈까요? 내 폰에는 지금까지 내용이 사본으로 남아요.`,'나가기',()=>leaveTrip(t.id,false))}
  else if(a==='joinPaste'){openSheet('초대 링크로 참여',[{k:'link',l:'받은 초대 링크나 메시지를 붙여넣으세요',type:'textarea'}],{},v=>{if(!/join-[a-z0-9]+-[A-Za-z0-9]+/.test(v.link))return'초대 링크를 찾지 못했어요';const L=v.link;setTimeout(()=>needName(()=>joinFrom(L)),0)})}
  else if(a==='sclose')closeSheet();
  else if(a==='sdel'&&sheetDel){const f=sheetDel;closeSheet();f()}
});
render();init();
}
</script>
</body></html>
